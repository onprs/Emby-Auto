name: 功能建议
description: 提议可验证的新能力或工作流改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前工作流中的具体限制，不要只描述期望的实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明用户行为、输入、输出和失败状态。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: textarea
    id: impact
    attributes:
      label: 契约与兼容性影响
      description: 是否涉及 API、数据库迁移、媒体格式、外部服务或部署方式。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 建议中不含真实凭据、媒体信息或生产环境细节。
          required: true
