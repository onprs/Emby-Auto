name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            tools/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Go tools
        run: npm run tools:download

      - name: Run static checks, unit tests, and builds
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests (desktop and mobile)
        run: npm run test:e2e --workspace @emby-auto/web

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate public Compose configuration
        run: npm run deploy:check

      - name: Validate direct Linux deployment templates
        run: npm run deploy:direct:check

      - name: 检查一键安装入口
        run: npm run deploy:install:check

      - name: Start integration PostgreSQL
        run: docker compose -f compose.yaml up -d --wait postgres

      - name: Apply application and River migrations
        run: |
          npm run db:migrate
          npm run db:river:migrate

      - name: Run migration and integration checks
        run: npm run check:integration

      - name: Stop integration PostgreSQL
        if: always()
        run: docker compose -f compose.yaml down --volumes

  direct-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate direct Linux release
        env:
          SKIP_NPM_CI: "1"
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          bash scripts/deploy/build-direct-release.sh "runtime/release/emby-auto-direct-${TARGET_GOARCH}"
          DIRECT_RELEASE_DIR="runtime/release/emby-auto-direct-${TARGET_GOARCH}" npm run deploy:direct:check-release

      - name: 保存一键安装发布包
        uses: actions/upload-artifact@v4
        with:
          name: emby-auto-direct-${{ matrix.goarch }}
          path: runtime/release/emby-auto-direct-${{ matrix.goarch }}-linux-${{ matrix.goarch }}.tar.gz
          retention-days: 3

  installer-smoke:
    needs: direct-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载当前构建的发布包
        uses: actions/download-artifact@v4
        with:
          name: emby-auto-direct-amd64
          path: runtime/install-test

      - name: 检查真实 systemd 一键安装
        run: sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted bash scripts/deploy/check-install-systemd.sh runtime/install-test

      - name: 输出安装失败诊断
        if: failure()
        run: |
          sudo systemctl status postgresql@17-emby_auto.service emby-auto-api.service emby-auto-worker.service --no-pager || true
          sudo journalctl -u postgresql@17-emby_auto.service -u emby-auto-api.service -u emby-auto-worker.service --no-pager -n 100
          sudo tail -n 100 /var/log/postgresql/postgresql-17-emby_auto.log || true

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deployment images
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml build

      - name: Validate deployment release
        run: bash scripts/deploy/check-compose.sh release
