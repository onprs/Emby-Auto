name: emby-auto

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emby_auto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emby_auto}
      POSTGRES_USER: ${POSTGRES_USER:-emby_auto}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
