upstream emby_auto_api {
    server api:8080;
    keepalive 16;
}

map $http_x_forwarded_proto $emby_auto_forwarded_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    include /etc/nginx/emby-auto-locations.conf;
}
