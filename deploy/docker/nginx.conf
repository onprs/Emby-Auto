upstream emby_auto_api {
    server api:8080;
    keepalive 16;
}

# 登录入口按来源限速，与应用内登录退避一起限制在线口令猜测。
limit_req_zone $binary_remote_addr zone=emby_auto_login:10m rate=10r/m;
limit_req_status 429;

map $http_x_forwarded_proto $emby_auto_forwarded_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    include /etc/nginx/emby-auto-locations.conf;
}
