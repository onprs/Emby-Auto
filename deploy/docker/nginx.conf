upstream emby_auto_api {
    server api:8080;
    keepalive 16;
}

# 本容器位于外层反向代理之后，只能看到外层代理地址，不能按对端 IP
# 区分最终客户端。登录限速由外层代理按最终客户端来源执行，应用自身
# 仍对登录失败按来源退避并限制并发校验。
map $http_x_forwarded_proto $emby_auto_forwarded_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    include /etc/nginx/emby-auto-locations.conf;
}
