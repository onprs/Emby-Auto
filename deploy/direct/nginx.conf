# 可选的 Nginx 回环代理示例；HTTPS 域名和证书由用户自行配置。
map $http_x_forwarded_proto $emby_auto_forwarded_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
}

# 登录入口按来源限速，与应用内登录退避一起限制在线口令猜测。
limit_req_zone $binary_remote_addr zone=emby_auto_login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 127.0.0.1:18079;
    server_name _;
    server_tokens off;

    location = /api/v1/auth/login {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $emby_auto_forwarded_proto;
        limit_req zone=emby_auto_login burst=5 nodelay;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $emby_auto_forwarded_proto;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
