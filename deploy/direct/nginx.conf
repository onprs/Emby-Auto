upstream emby_auto_api {
    server 127.0.0.1:18081;
    keepalive 16;
}

map $http_x_forwarded_proto $emby_auto_forwarded_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 127.0.0.1:18080;
    server_name _;
    server_tokens off;

    root /opt/emby-auto/current/web;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    include /etc/nginx/emby-auto-locations.conf;
}
