openapi: 3.1.0
info:
  title: Emby Auto API
  version: 0.22.0
  description: Contract for the Emby Auto API and generated clients.
servers:
  - url: /
    description: Same-origin API served directly or through a reverse proxy
security:
  - sessionCookie: []
tags:
  - name: Health
    description: Process and dependency health checks.
  - name: Setup
    description: One-time installation bootstrap.
  - name: Auth
    description: Administrator session authentication.
  - name: Config
    description: Runtime integration and filesystem configuration.
  - name: Agent
    description: Read-only audit records for constrained automatic Agent fallback.
  - name: Search
    description: Asynchronous release search and persisted candidates.
  - name: Acquisitions
    description: Commands that turn selected sources into download workflows.
  - name: TMDb
    description: TMDb catalog synchronization.
  - name: Mapping
    description: Episode mapping preview and versioned persistence.
  - name: Emby
    description: Emby filesystem refresh requests and catalog data persisted by this application.
  - name: RSS
    description: RSS subscription and polling commands.
  - name: Tasks
    description: Media processing, human review, and Emby import commands.
  - name: Events
    description: Real-time domain event delivery.
  - name: Downloads
    description: Download lifecycle, file resolution, and cancellation commands.
  - name: Operations
    description: Persisted asynchronous operation status and attempts.
  - name: Dashboard
    description: Aggregate status, system metrics, and background runtime controls.
paths:
  /api/v1/health/live:
    get:
      operationId: getHealthLive
      summary: Check whether the API process is alive
      tags: [Health]
      security: []
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/health/ready:
    get:
      operationId: getHealthReady
      summary: Check whether the API can serve database-backed requests
      tags: [Health]
      security: []
      responses:
        "200":
          description: The API and its required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      summary: Read one-time installation status
      tags: [Setup]
      security: []
      responses:
        "200":
          description: Current installation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/setup/initialize:
    post:
      operationId: initializeSetup
      summary: Initialize PostgreSQL, the first administrator, and runtime configuration
      tags: [Setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeSetupRequest"
      responses:
        "200":
          description: Installation completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create an administrator session
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The administrator is authenticated.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current administrator session
      tags: [Auth]
      responses:
        "204":
          description: The session was revoked.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: Read the current administrator session
      tags: [Auth]
      responses:
        "200":
          description: The current administrator session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/config:
    get:
      operationId: getConfiguration
      summary: Read runtime configuration with masked secrets
      tags: [Config]
      responses:
        "200":
          description: The current runtime configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: updateConfiguration
      summary: Replace runtime configuration using optimistic concurrency
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConfigurationRequest"
      responses:
        "200":
          description: The updated runtime configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/agent/resolutions:
    get:
      operationId: listAgentResolutions
      summary: List Agent resolutions
      tags: [Agent]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 50 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AgentResolutionStatus" }
        - name: capability
          in: query
          schema: { $ref: "#/components/schemas/AgentResolutionCapability" }
        - name: resourceType
          in: query
          schema: { type: string, maxLength: 128 }
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Agent resolution page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResolutionPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/agent/resolutions/{resolutionId}:
    get:
      operationId: getAgentResolution
      summary: Get one Agent resolution
      tags: [Agent]
      parameters:
        - name: resolutionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Agent resolution.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResolution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/searches:
    get:
      operationId: listSearches
      summary: List search runs
      tags: [Search]
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, running, completed, failed, cancelled]
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: A page of search runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchRunPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createSearch
      summary: Create an asynchronous release search
      tags: [Search]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSearchRequest"
      responses:
        "202":
          description: The search operation was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchCommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/searches/recent-candidates:
    get:
      operationId: listRecentSearchCandidates
      summary: List recent release candidates
      description: Returns up to 5 recent persisted release candidates ordered by search run creation (newest run first), then candidate persistence order (created_at, id). This is installation-level history and is not filtered by actor. Upstream payload is not exposed. Limit is bounded to 1..5.
      tags: [Search]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 5
            default: 5
      responses:
        "200":
          description: Recent release candidates across recent searches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseCandidatePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/searches/{searchId}:
    get:
      operationId: getSearch
      summary: Read a search run and its persisted release candidates
      tags: [Search]
      parameters:
        - name: searchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The search run and current candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/acquisitions:
    get:
      operationId: listAcquisitions
      summary: List complete lifecycle tasks
      description: Each acquisition is one user-facing task spanning source intake, download, media processing, review, and verified library import.
      tags: [Acquisitions]
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: sourceKind
          in: query
          required: false
          schema:
            type: string
            enum: [search, rss, manual]
        - name: tmdbSeriesId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: phase
          in: query
          required: false
          schema:
            type: string
            enum: [mapping_pending, downloading, processing, awaiting_review, importing, completed, attention]
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [content, source_kind, progress, updated_at]
            default: updated_at
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: A page of acquisitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createAcquisition
      summary: Select a release candidate and schedule its download
      tags: [Acquisitions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcquisitionRequest"
      responses:
        "202":
          description: The acquisition and download operation were accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionCommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/tmdb/series/{tmdbSeriesId}/sync:
    post:
      operationId: syncTMDbSeries
      summary: Schedule synchronization of one TMDb TV series
      tags: [TMDb]
      parameters:
        - name: tmdbSeriesId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncTMDbSeriesRequest"
      responses:
        "202":
          description: TMDb synchronization was scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogCommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/acquisitions/{acquisitionId}/episode-mapping/preview:
    post:
      operationId: previewAcquisitionEpisodeMapping
      summary: Preview mappings for selected video files
      tags: [Mapping]
      parameters:
        - name: acquisitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeMappingPlanRequest"
      responses:
        "200":
          description: Mapping preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeMappingPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/acquisitions/{acquisitionId}/episode-mapping:
    put:
      operationId: saveAcquisitionEpisodeMapping
      summary: Save a versioned episode mapping profile
      tags: [Mapping]
      parameters:
        - name: acquisitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveEpisodeMappingRequest"
      responses:
        "200":
          description: Mapping profile saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEpisodeMapping"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/emby/scans:
    get:
      operationId: listEmbyScans
      summary: List runs that updated the local catalog from Emby
      tags: [Emby]
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: History of local catalog updates read from Emby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbyScanPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createEmbyScan
      summary: Schedule an update of the local catalog from Emby
      description: Reads Emby's current libraries and items and stores that catalog in this application. This does not ask Emby to scan its filesystem.
      tags: [Emby]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Local catalog update from Emby scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbyScanCommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/emby/scans/{scanId}:
    get:
      operationId: getEmbyScan
      summary: Read one local catalog update run
      tags: [Emby]
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Result of updating the local catalog from Emby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbyScan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/emby/refresh:
    post:
      operationId: refreshEmbyLibrary
      summary: Ask Emby to scan its media files
      description: Calls Emby's library refresh endpoint. A succeeded operation means Emby accepted the request; Emby performs the filesystem scan asynchronously.
      tags: [Emby]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Request to ask Emby to scan its media files scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/emby/libraries:
    get:
      operationId: listEmbyLibraries
      summary: List current Emby libraries
      tags: [Emby]
      responses:
        "200":
          description: Current Emby libraries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmbyLibrary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/emby/libraries/{libraryId}/items:
    get:
      operationId: listEmbyLibraryItems
      summary: List persisted items in one Emby library
      tags: [Emby]
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemType
          in: query
          required: false
          schema:
            type: string
            enum: [Series, Season, Episode, Movie]
        - name: name
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: providerId
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: present
          in: query
          required: false
          schema:
            type: boolean
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Emby library item page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbyLibraryItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/rss/feed-lookup:
    post:
      operationId: lookupRSSFeed
      summary: Fetch an RSS feed and suggest a TMDb search query for it
      tags: [RSS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RSSFeedLookupRequest"
      responses:
        "200":
          description: The RSS feed lookup result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSSFeedLookup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/rss/subscriptions:
    get:
      operationId: listRSSSubscriptions
      summary: List active RSS subscriptions
      tags: [RSS]
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: query
          in: query
          required: false
          description: Case-insensitive substring match on the subscription name or series title.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [name, series_title, source_season, enabled, progress, next_poll_at]
            default: name
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: A page of RSS subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSSSubscriptionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createRSSSubscription
      summary: Create an RSS subscription and its continuous poll operation
      tags: [RSS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRSSSubscriptionRequest"
      responses:
        "201":
          description: The RSS subscription was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSSSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/rss/subscriptions/{subscriptionId}:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRSSSubscription
      summary: Read an RSS subscription
      tags: [RSS]
      responses:
        "200":
          description: The RSS subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSSSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: updateRSSSubscription
      summary: Replace an RSS subscription using optimistic concurrency
      tags: [RSS]
      requestBody:
        required: true
        content:
