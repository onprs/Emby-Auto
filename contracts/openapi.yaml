          items:
            type: string
            minLength: 1
        path:
          type: string
          minLength: 1
        usedBytes:
          type: integer
          format: int64
          minimum: 0
        totalBytes:
          type: integer
          format: int64
          minimum: 0
        usedPercent:
          type: number
          format: double
          minimum: 0
          maximum: 100
