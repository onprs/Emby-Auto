          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/events/history:
    get:
      operationId: listEvents
      summary: Read persisted domain events for one resource
      tags: [Events]
      parameters:
        - name: resourceType
          in: query
          required: true
          schema:
            type: string
        - name: resourceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of persisted events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/config/secrets/reveal:
    post:
      operationId: revealConfigurationSecrets
      summary: Reveal configured secrets for direct editing in the same-origin settings UI
      description: >-
        Authenticated-administrator exception to the masked configuration contract. Returns
        only secrets that are currently configured so each password input can be populated
        directly without requiring the other secrets. Every success or error response uses
        Cache-Control: no-store, max-age=0. Plaintext must not be logged, emitted as an event,
        placed in a client query cache, persisted in browser storage, or included in a URL.
      tags: [Config]
      responses:
        "200":
          description: The configured plaintext secrets; unconfigured properties are omitted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/SecretNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealedSecrets"
        "401":
          $ref: "#/components/responses/SecretRevealUnauthorized"
        "503":
          $ref: "#/components/responses/SecretRevealServiceUnavailable"
  /api/v1/config/test:
    post:
      operationId: testConnectivity
      summary: Test connectivity to one external dependency
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectivityTestRequest"
      responses:
        "200":
          description: The connectivity test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectivityTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Read aggregate counts and recent activity for the overview
      tags: [Dashboard]
      responses:
        "200":
          description: The dashboard summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/dashboard/background-runtime:
    get:
      operationId: getBackgroundRuntime
      summary: Read the Worker background runtime state
      tags: [Dashboard]
      responses:
        "200":
          description: The current Worker runtime state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundRuntime"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: updateBackgroundRuntime
      summary: Start or stop all Worker background execution
      tags: [Dashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBackgroundRuntimeRequest"
      responses:
        "200":
          description: The Worker reached the requested runtime state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundRuntime"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/dashboard/system-metrics:
    get:
      operationId: getDashboardSystemMetrics
      summary: Read the API host's rolling CPU, memory, network, and disk metrics
      tags: [Dashboard]
      responses:
        "200":
          description: In-memory host metrics ordered from oldest to newest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemMetricsSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/events:
    get:
      operationId: streamEvents
      summary: Stream domain events after an optional public event cursor
      tags: [Events]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A server-sent event stream. Event IDs are public event UUIDs.
          headers:
            Cache-Control:
              schema:
                type: string
            X-Accel-Buffering:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: emby_auto_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
  headers:
    SecretNoStore:
      description: Prevents storage of plaintext secret responses by browsers and intermediaries.
      required: true
      schema:
        type: string
        enum: ["no-store, max-age=0"]
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication is required or failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The command conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    SecretRevealUnauthorized:
      description: Authentication is required or failed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/SecretNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    SecretRevealServiceUnavailable:
      description: The secret configuration store is unavailable.
      headers:
        Cache-Control:
          $ref: "#/components/headers/SecretNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, checkedAt]
      properties:
        status:
          type: string
          enum: [live, ready]
        checkedAt:
          type: string
          format: date-time
    SetupStatus:
      type: object
      additionalProperties: false
      required: [state, databaseConfigured, databaseManagedExternally, administratorConfigured]
      properties:
        state:
          type: string
          enum: [required, initializing, completed]
        databaseConfigured:
          type: boolean
        databaseManagedExternally:
          type: boolean
        administratorConfigured:
          type: boolean
    SetupDatabase:
      type: object
      additionalProperties: false
      required: [host, port, database, username, password, sslMode]
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        database:
          type: string
          minLength: 1
          maxLength: 128
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          maxLength: 1024
        sslMode:
          type: string
          enum: [disable, require, verify-ca, verify-full]
    SetupAdministrator:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 1024
    SetupQBittorrentConfiguration:
      type: object
      additionalProperties: false
      required: [url, username, password]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          maxLength: 4096
    SetupEmbyConfiguration:
      type: object
      additionalProperties: false
      required: [url, apiKey]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
        apiKey:
          type: string
          minLength: 1
          maxLength: 4096
    SetupTMDbConfiguration:
      type: object
      additionalProperties: false
      required: [apiToken]
      properties:
        apiToken:
          type: string
          minLength: 1
          maxLength: 4096
    SetupRuntimeConfiguration:
      type: object
      additionalProperties: false
      required: [qBittorrent, emby, tmdb, paths, transcode]
      properties:
        qBittorrent:
          $ref: "#/components/schemas/SetupQBittorrentConfiguration"
        emby:
          $ref: "#/components/schemas/SetupEmbyConfiguration"
        tmdb:
          $ref: "#/components/schemas/SetupTMDbConfiguration"
        paths:
          $ref: "#/components/schemas/PathConfiguration"
        transcode:
          $ref: "#/components/schemas/TranscodeProfileConfiguration"
    InitializeSetupRequest:
      type: object
      additionalProperties: false
      required: [administrator, configuration]
      properties:
        database:
          $ref: "#/components/schemas/SetupDatabase"
        administrator:
          $ref: "#/components/schemas/SetupAdministrator"
        configuration:
          $ref: "#/components/schemas/SetupRuntimeConfiguration"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 1024
    Session:
      type: object
      additionalProperties: false
      required: [user, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        expiresAt:
          type: string
          format: date-time
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    Configuration:
      type: object
      additionalProperties: false
      required: [version, qBittorrent, emby, tmdb, networkProxy, agent, paths, transcode, events]
      properties:
        version:
          type: integer
          format: int32
          minimum: 0
        qBittorrent:
          $ref: "#/components/schemas/QBittorrentConfiguration"
        emby:
          $ref: "#/components/schemas/EmbyConfiguration"
        tmdb:
          $ref: "#/components/schemas/TMDbConfiguration"
        networkProxy:
          $ref: "#/components/schemas/NetworkProxyConfiguration"
        agent:
          $ref: "#/components/schemas/AgentConfiguration"
        paths:
          $ref: "#/components/schemas/PathConfiguration"
        transcode:
          $ref: "#/components/schemas/TranscodeProfileConfiguration"
        events:
          $ref: "#/components/schemas/EventsConfiguration"
    EventsConfiguration:
      type: object
      additionalProperties: false
      required: [retentionDays]
      properties:
        retentionDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 36500
          description: 明确标记为可由业务表恢复的事件保留天数。后台定期任务删除超过保留期的 allowlist 事件；业务导入历史由结构化 provenance 记录保留，未知事件类型始终保留；0 表示禁用定期清理。
    QBittorrentConfiguration:
      type: object
      additionalProperties: false
      required: [url, username, password, downloadRateLimitKibPerSecond, uploadRateLimitKibPerSecond]
      properties:
        url:
          type: string
        username:
          type: string
        password:
          $ref: "#/components/schemas/SecretStatus"
        downloadRateLimitKibPerSecond:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          description: Per-torrent download rate limit in KiB/s. Zero disables the limit. Responses preserve legacy persisted values above the current update limit.
        uploadRateLimitKibPerSecond:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          description: Per-torrent upload rate limit in KiB/s. Zero disables the limit. Responses preserve legacy persisted values above the current update limit.
    EmbyConfiguration:
      type: object
      additionalProperties: false
      required: [url, apiKey]
      properties:
        url:
          type: string
        apiKey:
          $ref: "#/components/schemas/SecretStatus"
    TMDbConfiguration:
      type: object
      additionalProperties: false
      required: [apiToken]
      properties:
        apiToken:
          $ref: "#/components/schemas/SecretStatus"
    NetworkProxyConfiguration:
      type: object
      additionalProperties: false
      required: [enabled, url]
      properties:
        enabled:
          type: boolean
        url:
          type: string
          maxLength: 2048
    AgentResolutionMode:
      type: string
      enum: [off, suggest, validated_auto]
    AgentConfiguration:
      type: object
      additionalProperties: false
      required:
        - enabled
        - protocol
        - baseUrl
        - model
        - apiKey
        - useNetworkProxy
        - requestTimeoutSeconds
        - rssCoordinateMode
        - downloadFileSelectionMode
        - catalogMatchEnabled
        - episodeMappingEnabled
        - allowAutomaticEpisodeMapping
        - subtitleVideoMatchMode
      properties:
        enabled:
          type: boolean
        protocol:
          type: string
          enum: [openai_chat_completions]
        baseUrl:
          type: string
          maxLength: 2048
        model:
          type: string
          maxLength: 256
        apiKey:
          $ref: "#/components/schemas/SecretStatus"
        useNetworkProxy:
          type: boolean
        requestTimeoutSeconds:
          type: integer
          format: int32
          minimum: 10
          maximum: 120
        rssCoordinateMode:
          $ref: "#/components/schemas/AgentResolutionMode"
        downloadFileSelectionMode:
          $ref: "#/components/schemas/AgentResolutionMode"
        catalogMatchEnabled:
          type: boolean
        episodeMappingEnabled:
          type: boolean
        allowAutomaticEpisodeMapping:
          type: boolean
        subtitleVideoMatchMode:
          $ref: "#/components/schemas/AgentResolutionMode"
    AgentConfigurationUpdate:
      type: object
      additionalProperties: false
      required:
        - enabled
        - protocol
        - baseUrl
        - model
        - apiKey
        - useNetworkProxy
        - requestTimeoutSeconds
        - rssCoordinateMode
        - downloadFileSelectionMode
        - catalogMatchEnabled
        - episodeMappingEnabled
        - allowAutomaticEpisodeMapping
        - subtitleVideoMatchMode
      properties:
        enabled:
          type: boolean
        protocol:
          type: string
          enum: [openai_chat_completions]
        baseUrl:
          type: string
          maxLength: 2048
        model:
          type: string
          maxLength: 256
        apiKey:
          $ref: "#/components/schemas/SecretUpdate"
        useNetworkProxy:
          type: boolean
        requestTimeoutSeconds:
          type: integer
          format: int32
          minimum: 10
          maximum: 120
        rssCoordinateMode:
          $ref: "#/components/schemas/AgentResolutionMode"
        downloadFileSelectionMode:
          $ref: "#/components/schemas/AgentResolutionMode"
        catalogMatchEnabled:
          type: boolean
        episodeMappingEnabled:
          type: boolean
        allowAutomaticEpisodeMapping:
          type: boolean
        subtitleVideoMatchMode:
          $ref: "#/components/schemas/AgentResolutionMode"
    AgentConnectivityTestConfiguration:
      type: object
      additionalProperties: false
      required: [protocol, baseUrl, model, apiKey, useNetworkProxy]
      properties:
        protocol:
          type: string
          enum: [openai_chat_completions]
        baseUrl:
          type: string
          maxLength: 2048
        model:
          type: string
          maxLength: 256
        apiKey:
          $ref: "#/components/schemas/SecretUpdate"
        useNetworkProxy:
          type: boolean
    PathConfiguration:
      type: object
      additionalProperties: false
      required: [downloadRoot, workRoot, stagingRoot, animeLibraryRoot, movieLibraryRoot, ffmpegPath, ffprobePath]
      properties:
        downloadRoot:
          type: string
        workRoot:
          type: string
        stagingRoot:
          type: string
        animeLibraryRoot:
          type: string
        movieLibraryRoot:
          type: string
        ffmpegPath:
          type: string
        ffprobePath:
          type: string
    TranscodeProfileConfiguration:
      type: object
      additionalProperties: false
      required:
        - name
        - videoCodec
        - encoder
        - container
        - fileExtension
        - qualityMode
        - qualityValue
        - audioPolicy
        - preset
        - pixelFormat
        - threadCount
        - maxConcurrency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        videoCodec:
          type: string
          enum: [h264, hevc, av1]
        encoder:
          type: string
          enum: [libx264, h264_nvenc, libx265, hevc_nvenc, libsvtav1, libaom-av1, av1_nvenc]
        container:
          type: string
          enum: [matroska, mp4, webm]
        fileExtension:
          type: string
          pattern: "^[a-z0-9]+$"
        qualityMode:
          type: string
          enum: [crf, cq, bitrate]
        qualityValue:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.001
        audioPolicy:
          type: string
          enum: [copy, transcode]
        audioCodec:
          type: string
          enum: [aac, ac3, eac3, flac, opus, vorbis]
        preset:
          type: string
          minLength: 1
        pixelFormat:
          type: string
          enum: [yuv420p, yuv420p10le, yuv422p, yuv422p10le, yuv444p, yuv444p10le, nv12, p010le]
        threadCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 256
        maxConcurrency:
          type: integer
          format: int32
          minimum: 1
          maximum: 64
    SecretStatus:
      type: object
      additionalProperties: false
      required: [configured, masked]
      properties:
        configured:
          type: boolean
        masked:
          type: string
    UpdateConfigurationRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, qBittorrent, emby, tmdb, networkProxy, agent, paths, transcode]
      properties:
        expectedVersion:
          type: integer
          format: int32
          minimum: 0
        qBittorrent:
          $ref: "#/components/schemas/QBittorrentConfigurationUpdate"
        emby:
          $ref: "#/components/schemas/EmbyConfigurationUpdate"
        tmdb:
          $ref: "#/components/schemas/TMDbConfigurationUpdate"
        networkProxy:
          $ref: "#/components/schemas/NetworkProxyConfiguration"
        agent:
          $ref: "#/components/schemas/AgentConfigurationUpdate"
        paths:
          $ref: "#/components/schemas/PathConfiguration"
        transcode:
          $ref: "#/components/schemas/TranscodeProfileConfiguration"
        events:
          $ref: "#/components/schemas/EventsConfiguration"
    QBittorrentConfigurationUpdate:
      type: object
      additionalProperties: false
      required: [url, username, password, downloadRateLimitKibPerSecond, uploadRateLimitKibPerSecond]
      properties:
        url:
          type: string
        username:
          type: string
        password:
          $ref: "#/components/schemas/SecretUpdate"
        downloadRateLimitKibPerSecond:
          type: integer
          format: int64
          minimum: 0
          maximum: 2097151
        uploadRateLimitKibPerSecond:
          type: integer
          format: int64
          minimum: 0
          maximum: 2097151
    QBittorrentConnectivityTestConfiguration:
      type: object
      additionalProperties: false
      description: Unsaved credentials used to test qBittorrent login. Rate-limit fields are compatibility-only inputs and are ignored by the connectivity test.
      required: [url, username, password]
      properties:
        url:
          type: string
        username:
          type: string
        password:
          $ref: "#/components/schemas/SecretUpdate"
        downloadRateLimitKibPerSecond:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          deprecated: true
          x-deprecated-reason: Retained only for requests from older clients; ignored by connectivity tests.
          description: Compatibility-only field accepted from older clients and ignored by the connectivity test.
        uploadRateLimitKibPerSecond:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          deprecated: true
          x-deprecated-reason: Retained only for requests from older clients; ignored by connectivity tests.
          description: Compatibility-only field accepted from older clients and ignored by the connectivity test.
    EmbyConfigurationUpdate:
      type: object
      additionalProperties: false
      required: [url, apiKey]
      properties:
        url:
          type: string
        apiKey:
          $ref: "#/components/schemas/SecretUpdate"
    TMDbConfigurationUpdate:
      type: object
      additionalProperties: false
      required: [apiToken]
      properties:
        apiToken:
          $ref: "#/components/schemas/SecretUpdate"
    SecretUpdate:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [keep, set, clear]
        value:
          type: string
          minLength: 1
          maxLength: 4096
    RevealedSecrets:
      type: object
      additionalProperties: false
      description: Configured plaintext secrets returned only by the authenticated settings reveal exception.
      properties:
        qbPassword:
          type: string
          minLength: 1
          maxLength: 4096
          description: Decrypted qBittorrent password when configured.
        embyApiKey:
          type: string
          minLength: 1
          maxLength: 4096
          description: Decrypted Emby API key when configured.
        tmdbApiToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: Decrypted TMDb API read access token when configured.
        agentApiKey:
          type: string
          minLength: 1
          maxLength: 4096
          description: Decrypted Agent API key when configured.
    AgentResolutionStatus:
      type: string
      enum: [queued, running, proposed, review_required, applied, rejected, failed, cancelled, expired]
    AgentResolutionCapability:
      type: string
      enum: [rss_coordinate, rss_release_adjudication, rss_preacquisition_mapping, download_file_resolution, catalog_candidate, episode_mapping]
    AgentProposalValidation:
      type: object
      additionalProperties: false
      required: [verdict, reasonCodes]
      properties:
        verdict:
          type: string
          enum: [auto_applicable, review_required, invalid]
        reasonCodes:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 128 }
    AgentRSSCoordinateProposal:
      type: object
      additionalProperties: false
      required: [capability, entryId, sourceSeason, sourceEpisode, evidenceCodes, decision]
      properties:
        capability: { type: string, const: rss_coordinate }
        entryId: { type: string, format: uuid }
        sourceSeason: { type: integer, format: int32, minimum: 1 }
        sourceEpisode: { type: integer, format: int32, minimum: 1 }
        evidenceCodes:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 128 }
        decision: { type: string, enum: [resolved, review_required] }
    AgentRSSReleaseDisposition:
      type: object
      additionalProperties: false
      required: [entryId, disposition, evidenceCodes]
      properties:
        entryId: { type: string, format: uuid }
        disposition: { type: string, enum: [select, ignore, review_required] }
        sourceSeason: { type: integer, format: int32, minimum: 1 }
        sourceEpisode: { type: integer, format: int32, minimum: 1 }
        relatedEntryId: { type: string, format: uuid }
        evidenceCodes:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 128 }
    AgentRSSReleaseAdjudicationProposal:
      type: object
      additionalProperties: false
      required: [capability, batchId, scopedEntryIds, entries, decision]
      properties:
        capability: { type: string, const: rss_release_adjudication }
        batchId: { type: string, format: uuid }
        scopedEntryIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
        entries:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/AgentRSSReleaseDisposition" }
        decision: { type: string, enum: [resolved, review_required] }
    AgentRSSPreacquisitionMappingProposal:
      type: object
