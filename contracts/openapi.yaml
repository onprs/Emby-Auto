    RSSSubscription:
      type: object
      additionalProperties: false
      required:
        - id
        - seriesId
        - tmdbSeriesId
        - seriesTitle
        - name
        - feedUrl
        - includeKeywords
        - excludeKeywords
        - enabled
        - autoEpisodeMapping
        - autoReview
        - cleanupSourceOnCompletion
        - sourceSeason
        - pollIntervalSeconds
        - overallProgress
        - taskCount
        - completedTaskCount
        - attentionTaskCount
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        tmdbSeriesId:
          type: integer
          format: int64
          minimum: 1
        seriesTitle:
          type: string
        mappingProfileId:
          type: string
          format: uuid
        name:
          type: string
        feedUrl:
          type: string
          format: uri
        includeKeywords:
          type: array
          maxItems: 20
          uniqueItems: true
          description: Optional case-insensitive title substrings. When configured, an entry title must contain at least one include keyword.
          items:
            type: string
            minLength: 1
            maxLength: 128
        excludeKeywords:
          type: array
          maxItems: 20
          uniqueItems: true
          description: Optional case-insensitive title substrings. An entry is rejected when its title contains any exclude keyword; exclusion takes precedence over inclusion.
          items:
            type: string
            minLength: 1
            maxLength: 128
        enabled:
          type: boolean
        autoEpisodeMapping:
          type: boolean
          description: Automatically maps selected RSS episode files after deterministic validation; when deterministic mapping is inconclusive, the configured Agent Episode Mapping capability may be used as fallback.
        autoReview:
          type: boolean
          description: Automatically records an approved review and queues verified Emby import when an RSS episode finishes media validation.
        cleanupSourceOnCompletion:
          type: boolean
          description: Remove this subscription's qBittorrent items, download cache, and processing files after every mapped source episode has been imported. Imported library files and history records are always preserved.
        sourceSeason:
          type: integer
          format: int32
          minimum: 1
        pollIntervalSeconds:
          type: integer
          format: int32
          minimum: 60
          maximum: 86400
        lastPolledAt:
          type: string
          format: date-time
        nextPollAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          description: Time when the configured final source episode completed and the subscription became non-runnable.
        overallProgress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Weighted mean lifecycle progress of all effective acquisition tasks owned by this subscription.
        taskCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of effective acquisition tasks included in the subscription progress.
        completedTaskCount:
          type: integer
          format: int32
          minimum: 0
        attentionTaskCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of included acquisition tasks that currently require operator attention.
        retryableTaskCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of failed tasks for this subscription that can be retried.
        version:
          type: integer
          format: int32
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
